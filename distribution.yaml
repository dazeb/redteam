name: redteam-profile
version: 1.0.0
description: "Opinionated red team Hermes profile with security-focused workflows, curated skills, and hardened defaults"
author: "Darren"
license: "MIT"
hermes_requires: ">=0.12.0"

env_requires:
  - name: OPENAI_API_KEY
    description: "Primary model access"
    required: false
    default: ""
  - name: ANTHROPIC_API_KEY
    description: "Optional alternate model access"
    required: false
    default: ""
  - name: XAI_API_KEY
    description: "Optional Grok access"
    required: false
    default: ""
