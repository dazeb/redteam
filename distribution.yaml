name: redteam-profile
version: 1.0.1
description: "Opinionated red team Hermes scenario bundle with the skills, workflows, and defaults used in the ai-supply-chain-lab"
author: "Darren"
license: "MIT"
hermes_requires: ">=0.12.0"

env_requires:
  - name: OPENAI_API_KEY
    description: "Primary model access"
    required: false
    default: ""
  - name: ANTHROPIC_API_KEY
    description: "Optional alternate model access"
    required: false
    default: ""
  - name: XAI_API_KEY
    description: "Optional Grok access"
    required: false
    default: ""
